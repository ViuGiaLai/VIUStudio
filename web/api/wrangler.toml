name = "viustudio-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "viustudio-db"
database_id = "local-viustudio-d1"

# In local dev or standalone runs, in-memory store handles state gracefully
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
CORS_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
