name: Build and Release VIUStudio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-base.txt
            requirements-local.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          pip install -r requirements-local.txt

      - name: Download & setup FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/ffmpeg
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force
          $binDir = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -ExpandProperty DirectoryName -First 1
          Copy-Item "$binDir\ffmpeg.exe" -Destination "bin/ffmpeg/ffmpeg.exe"
          Copy-Item "$binDir\ffprobe.exe" -Destination "bin/ffmpeg/ffprobe.exe"
          Write-Host "FFmpeg setup completed."

      - name: Download Silero VAD & Base Models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          New-Item -ItemType Directory -Force -Path models/sensevoice
          New-Item -ItemType Directory -Force -Path models/piper

          # Download Silero VAD
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" -OutFile "bin/silero_vad.onnx"

          # Download SenseVoice Small ONNX
          Invoke-WebRequest -Uri "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/model.int8.onnx" -OutFile "models/sensevoice/model.int8.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/tokens.txt" -OutFile "models/sensevoice/tokens.txt"

          # Download Piper base voice models
          try {
            $piperZip = "$env:TEMP\piper.zip"
            Invoke-WebRequest -Uri "https://huggingface.co/Hacht/CapCapResource/resolve/main/piper.zip" -OutFile $piperZip -TimeoutSec 120
            if (Test-Path $piperZip) {
              Expand-Archive -Path $piperZip -DestinationPath "models/piper" -Force
            }
          } catch {
            Write-Host "Piper models download optional note: $_"
          }

          Write-Host "Base models setup completed."

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $env:VIUSTUDIO_WINDOWED_BUILD = "1"
          pyinstaller --noconfirm VIUStudio.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          $ver = (Get-Content app/version.py | Where-Object { $_ -match 'APP_VERSION\s*=\s*["'']([^"'']+)["'']' } | ForEach-Object { $matches[1] })
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$ver" }
          $cleanVersion = $tag.TrimStart("v")
          $env:APP_VERSION = $cleanVersion
          Write-Host "Building Inno Setup for version: $cleanVersion"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VIUStudio_setup.iss

      - name: Create Release Zip Archive (Portable)
        shell: pwsh
        run: |
          $ver = (Get-Content app/version.py | Where-Object { $_ -match 'APP_VERSION\s*=\s*["'']([^"'']+)["'']' } | ForEach-Object { $matches[1] })
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$ver" }
          $zipName = "dist\VIUStudio-$tag-Windows-Portable.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            Write-Host "Using 7-Zip for fast multi-threaded compression..."
            7z a -tzip -mx=4 "$zipName" ".\dist\VIUStudio\*"
          } else {
            Write-Host "7-Zip not found, falling back to Compress-Archive..."
            Compress-Archive -Path "dist\VIUStudio\*" -DestinationPath "$zipName" -Force
          }
          Write-Host "Created portable archive: $zipName"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content app/version.py | Where-Object { $_ -match 'APP_VERSION\s*=\s*["'']([^"'']+)["'']' } | ForEach-Object { $matches[1] })
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$ver" }
          Write-Host "Publishing GitHub Release for tag: $tag"

          # Check if release exists; if not, create it
          $releaseView = & gh release view $tag 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Release $tag does not exist. Creating..."
              & gh release create $tag --title "$tag" --generate-notes
              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Initial creation returned code $LASTEXITCODE. Re-checking..."
                  $null = & gh release view $tag 2>&1
                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not create or locate release for $tag"
                  }
              }
          } else {
              Write-Host "Release $tag already exists. Proceeding to asset upload."
          }

          # Locate assets
          $assets = Get-ChildItem -Path "dist\*.exe", "dist\*.zip"
          if (-not $assets -or $assets.Count -eq 0) {
              throw "No release assets found in dist/ (*.exe or *.zip)"
          }

          # Upload assets sequentially with retry logic to avoid socket reset
          foreach ($asset in $assets) {
              $sizeMB = [math]::Round($asset.Length / 1MB, 2)
              Write-Host "=========================================="
              Write-Host "Uploading $($asset.Name) ($sizeMB MB)..."
              Write-Host "=========================================="
              $uploaded = $false
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  Write-Host "Attempt $attempt of 3..."
                  & gh release upload $tag $asset.FullName --clobber
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "Successfully uploaded $($asset.Name)"
                      $uploaded = $true
                      break
                  }
                  Write-Warning "Attempt $attempt failed for $($asset.Name). Retrying in 15 seconds..."
                  Start-Sleep -Seconds 15
              }
              if (-not $uploaded) {
                  throw "Failed to upload $($asset.Name) after 3 attempts."
              }
          }
          Write-Host "All assets uploaded successfully to release $tag!"
